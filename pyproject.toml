[project]
name = "ha-ltek-trackers"
version = "0.1.0"
description = "Home Assistant integration for LTEK trackers"
readme = "README.md"
requires-python = ">=3.13"

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component>=0.13.316",
  "ruff>=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
